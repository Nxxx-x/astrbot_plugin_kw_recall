name: astrbot_plugin_kw_recall
display_name: 消息撤回
short_desc: QQ 官方机器人自动撤回违禁词、链接、号码、二维码、Emoji，刷屏自动禁言，面板一键解禁
desc: 面向 QQ 官方机器人适配器的消息管理插件。群消息命中违禁词、链接、5 位及以上连续数字、二维码图片或 Unicode Emoji 时调用官方撤回接口删除（QQ 自带表情、@ 标签不参与判断）；同一成员 1 秒内发言达到阈值自动禁言（默认 3 条/秒、60 秒，时长与提示可配）。五类规则与刷屏检测默认开启，可在插件设置页逐类开关、各配文案，提示会艾特当事人。群里发「菜单」弹出面板：7 个开关 + 一键解禁，一行两个四行发完，按钮仅群主/管理员可点；点击开关只回「已开 / 已关」，一键解禁回解禁人数；面板标题可在设置里自定义，除「菜单」外不含其他聊天指令。
version: 1.14.0
author: 小雨季
